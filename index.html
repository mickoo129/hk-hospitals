<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef8f4">
  <title>香港醫院指南 · Hong Kong Hospitals</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="app-header">
    <div class="header-row">
      <div class="brand">
        <h1 id="title">香港醫院指南</h1>
        <div class="sub" id="subtitle">公立 · 私家 · 專科門診</div>
      </div>
      <div class="lang-toggle">
        <button type="button" id="btnTc" class="on">繁</button>
        <button type="button" id="btnEn">EN</button>
      </div>
    </div>
    <div class="search-wrap">
      <span class="search-ico">⌕</span>
      <input id="search" type="search" placeholder="搜尋醫院、診所或專科">
    </div>
  </header>
  <div class="filters" id="filters"></div>
  <main id="view"></main>
  <nav class="tabbar">
    <button class="tab on" data-view="list"><span>目錄</span></button>
    <button class="tab" data-view="map"><span>地圖</span></button>
    <button class="tab" data-view="about"><span>說明</span></button>
  </nav>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/boot.js"></script>
  <script src="js/lang-swap.js"></script>
  <script src="js/spec-fix.js"></script>
</body>
</html>
