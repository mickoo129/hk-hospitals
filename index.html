<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f2f2f7">
  <title>香港醫院指南 · Hong Kong Hospitals</title>
  <meta name="description" content="Directory of public hospitals, private hospitals and specialist outpatient clinics in Hong Kong.">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="app-header">
    <div class="header-row">
      <div class="brand">
        <h1 id="title">香港醫院指南</h1>
        <div class="sub" id="subtitle">公立 · 私家 · 專科門診</div>
      </div>
      <div class="lang-toggle">
        <button type="button" id="btnTc" class="on">繁</button>
        <button type="button" id="btnEn">EN</button>
      </div>
    </div>
    <div class="search-wrap">
      <span class="search-ico">⌕</span>
      <input id="search" type="search" placeholder="搜尋醫院、診所或專科" enterkeyhint="search">
    </div>
  </header>
  <div class="filters" id="filters"></div>
  <main id="view"></main>
  <nav class="tabbar">
    <button class="tab on" data-view="list" data-i18n="tabList">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="4" rx="1.2"/><rect x="4" y="11" width="16" height="4" rx="1.2"/><rect x="4" y="17" width="16" height="4" rx="1.2"/></svg>
      <span>目錄</span>
    </button>
    <button class="tab" data-view="map" data-i18n="tabMap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 4 4 6v14l5-2 6 2 5-2V4l-5 2-6-2z"/><path d="M10 8v10M16 6v12"/></svg>
      <span>地圖</span>
    </button>
    <button class="tab" data-view="wait" data-i18n="tabWait">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 8v5l3 2"/></svg>
      <span>輪候</span>
    </button>
    <button class="tab" data-view="about" data-i18n="tabAbout">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 11v6M12 8h.01"/></svg>
      <span>說明</span>
    </button>
  </nav>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
